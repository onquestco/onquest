<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>My Goa Trip — Salt in the Air, Sand in My Hair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500&family=Kaushan+Script&family=Playfair+Display:ital,wght@0,500;1,500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1E9D8;--ocean:#177E89;--navy:#123B47;--sand:#E8D9BD;--coral:#F28C70;--orange:#F28C3A;--blue:#A3BCC9;--cream:#FFF6D8;--script:'Kaushan Script',cursive;--type:'Special Elite',monospace;--hand:'Caveat',cursive;--sans:'DM Sans',system-ui,sans-serif;--serif:'Playfair Display',Georgia,serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg) url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22220%22 height=%22220%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.8%22 numOctaves=%222%22/%3E%3CfeColorMatrix values=%220 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .1 0%22/%3E%3C/filter%3E%3Crect width=%22220%22 height=%22220%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');color:var(--navy);font:400 1rem/1.6 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.sec-title{font:clamp(2.4rem,8vw,4.2rem)/1 var(--script);text-align:center;padding:clamp(40px,8vw,80px) 16px 8px}
.hint{font:500 1.5rem/1.2 var(--hand);color:var(--ocean);text-align:center;padding:0 16px 14px}
.spread{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:clamp(24px,5vw,60px) 16px}

/* story cards */
.stage{position:relative;container-type:inline-size;width:min(94vw,540px);aspect-ratio:9/14;overflow:hidden;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.12),0 26px 50px rgba(18,59,71,.22);background:var(--blue)}
.stage.sand{background:linear-gradient(#EADFC8,#E2D1B0)}
.stage.cream{background:var(--cream)}
.stage:not(.in) .sc,.stage:not(.in) .tx{visibility:hidden}
.stage.in .sc{animation:drop .8s var(--d,0s) backwards cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{opacity:0;scale:.7;translate:0 -4cqw}}
.tx{position:absolute;z-index:5}
.big{font:15cqw/1 var(--script)}
.ty{font:4.4cqw/1.3 var(--type);letter-spacing:.04em}
.hd{font:5.6cqw/1.1 var(--hand)}
.strip{display:inline-block;background:#fff;padding:1.4cqw 3cqw;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.2);font:5cqw/1.2 var(--type);rotate:-2deg}
.air{padding:1cqw;background:repeating-linear-gradient(135deg,#D8402F 0 3cqw,#fff 3cqw 6cqw,#2F6FB0 6cqw 9cqw);box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.2)}
.air span{display:block;background:#fff;padding:.8cqw 3cqw;font:3cqw/1.3 var(--type);letter-spacing:.14em;text-align:center}
.stamp{border:.8cqw dashed var(--coral);background:#fff;padding:1.6cqw 2cqw;text-align:center;font:3.2cqw/1.2 var(--type);color:var(--coral);rotate:8deg}
.stamp b{display:block;font-size:7cqw}
.swatch{display:flex;gap:1.6cqw}.swatch i{width:4.4cqw;height:4.4cqw;border-radius:50%}
.doodle{position:absolute;fill:none;stroke:var(--navy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8;z-index:1}

/* scraps */
.sc{position:absolute;display:block;padding:0;border:0;background:none;rotate:var(--r);filter:drop-shadow(0 .8cqw 1.2cqw rgba(0,0,0,.28));transition:rotate .35s,scale .35s,translate .5s;touch-action:manipulation}
.stage.in .sc:hover,.stage.in .sc:focus-visible{rotate:0deg;scale:1.05;z-index:30!important}
.shape{display:block;position:relative;width:100%;aspect-ratio:var(--ar)}
.shape img{width:100%;height:100%;object-fit:cover}
.shape i{display:none}
.torn .shape{background:#fff;padding:1.4cqw;clip-path:polygon(1% 2%,9% 0,19% 3%,31% 0,44% 2%,57% 0,70% 3%,83% 0,93% 2%,100% 0,99% 14%,100% 28%,98% 43%,100% 58%,99% 72%,100% 86%,98% 100%,87% 98%,74% 100%,60% 98%,46% 100%,33% 98%,20% 100%,8% 98%,0 100%,1% 86%,0 71%,2% 57%,0 42%,1% 28%,0 14%)}
.torn .shape img{clip-path:polygon(2% 1%,12% 3%,26% 0,40% 2%,55% 0,68% 3%,82% 1%,97% 3%,99% 16%,97% 32%,100% 47%,98% 62%,100% 78%,98% 95%,86% 99%,70% 97%,55% 100%,40% 98%,26% 100%,12% 97%,2% 99%,0 84%,2% 68%,0 52%,2% 36%,0 20%)}
.pol .shape{background:#fff;padding:2.6cqw 2.6cqw 9.5cqw;aspect-ratio:auto}
.pol .shape img{height:auto;aspect-ratio:var(--ar)}
.pol .shape i{display:block;position:absolute;left:0;right:0;bottom:2.4cqw;text-align:center;font:500 4.8cqw/1 var(--hand)}
.pol::before{content:'';position:absolute;z-index:2;top:-1.8cqw;left:50%;width:15cqw;height:4.6cqw;margin-left:-7.5cqw;background:var(--tape,rgba(242,140,112,.65));rotate:-4deg}
.circ .shape{aspect-ratio:1;border-radius:50%;overflow:hidden;border:1.4cqw solid #fff}
.lift{cursor:grabbing!important;transition:none!important;rotate:0deg!important;scale:1.06!important;filter:drop-shadow(0 2.4cqw 3cqw rgba(0,0,0,.4))}

/* map */
.mapsec{background:linear-gradient(var(--bg),#D6E3E7 12%,#D6E3E7 88%,var(--bg));padding-bottom:50px}
.mapstage{position:relative;width:min(94vw,620px);aspect-ratio:610/830;margin:0 auto;box-shadow:0 26px 50px rgba(18,59,71,.22);border:10px solid #fff;border-radius:4px;overflow:hidden;rotate:-.6deg;background:#cfe3e1}
.mapsvg{width:100%;height:100%;display:block}
.sp{cursor:pointer;outline:none}
.sp .dot{fill:var(--navy);stroke:#fff;stroke-width:3}
.sp .chip{fill:#fff;stroke:var(--navy);stroke-width:1.2;transition:fill .2s}
.sp text{font:500 20px 'DM Sans',sans-serif;fill:var(--navy)}
.sp:hover .chip,.sp:focus-visible .chip{fill:var(--coral)}
.pulse{animation:pulse 2.4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.7;scale:1}100%{opacity:0;scale:3}}

/* rail */
.days{padding-bottom:50px}
.railwrap{position:relative}
.rail{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px max(16px,calc(50% - 170px)) 28px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .stage{flex:0 0 min(78vw,340px);width:auto;scroll-snap-align:center}
.rnav{position:absolute;top:50%;z-index:10;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 18px rgba(18,59,71,.3);font-size:1.8rem;line-height:1;translate:0 -50%}
.rnav.p{left:12px}.rnav.n{right:12px}
@media(max-width:700px){.rnav{display:none}}
.tap{border:0;background:#fff;border-radius:99px;padding:1.4cqw 4cqw;font:500 5.4cqw/1.2 var(--hand);box-shadow:0 .8cqw 1.6cqw rgba(0,0,0,.2);left:50%;translate:-50% 0;bottom:3.5%;top:auto}

/* closing */
.post{border:0;padding:1.4cqw;background:repeating-linear-gradient(135deg,#D8402F 0 3cqw,#fff 3cqw 6cqw,#2F6FB0 6cqw 9cqw);box-shadow:0 1.4cqw 3cqw rgba(0,0,0,.25);text-align:left;rotate:-1.5deg;transition:rotate .3s}
.post:hover{rotate:0deg}
.post span{display:block;background:#fffdf5;padding:4cqw 5cqw}
.post b{display:block;font:italic 500 8.4cqw/1.15 var(--serif)}
.post small{font:500 4.8cqw/1 var(--hand);color:var(--coral)}
.btns{display:flex;gap:2cqw}
.btn{border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:99px;padding:2cqw 4.6cqw;font:500 3.8cqw/1 var(--sans);transition:background .2s}
.btn:hover{background:var(--ocean);border-color:var(--ocean)}
.btn.g{background:transparent;color:var(--navy)}.btn.g:hover{color:#fff}
.toast{font:500 4.8cqw/1 var(--hand);color:var(--ocean);min-height:1em}
.cta{font:3.4cqw var(--sans);opacity:.7;color:var(--navy)}
.foot{height:90px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:100;display:grid;place-items:end center;background:rgba(18,59,71,.6);backdrop-filter:blur(3px);animation:fade .25s}
.sheet[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.panel{position:relative;background:#FBF5E6;width:min(100%,720px);max-height:92svh;overflow:auto;border-radius:22px 22px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.4);animation:up .38s cubic-bezier(.2,.9,.3,1);display:grid}
@keyframes up{from{translate:0 40px;opacity:0}}
.s-photo{position:relative;background:var(--sand);aspect-ratio:4/3;overflow:hidden;touch-action:pan-y}
.s-photo img{width:100%;height:100%;object-fit:cover}
.s-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 12px;background:linear-gradient(transparent,rgba(18,59,71,.75));color:#fff;font:500 1.5rem/1.1 var(--hand)}
.nv{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:1.7rem;line-height:1}
.nv.p{left:10px}.nv.n{right:10px}
.dots{position:absolute;top:12px;left:0;right:0;display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i.on{background:#fff}
.s-body{padding:22px 24px 30px}
.kick{font:.9rem var(--type);color:var(--coral);letter-spacing:.08em;text-transform:uppercase}
.s-body h3{font:500 clamp(1.8rem,5vw,2.4rem)/1.1 var(--serif);margin:4px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tags span{border:2px solid var(--ocean);color:var(--ocean);border-radius:8px;padding:4px 12px;font:italic 500 .95rem var(--serif);rotate:-2deg;outline:2px dashed var(--ocean);outline-offset:3px;margin-right:4px}
.tags span:nth-child(even){rotate:2deg;color:var(--coral);border-color:var(--coral);outline-color:var(--coral)}
.mq{background:#FFF1A6;color:#5b4a22;padding:14px 18px;font:500 1.6rem/1.2 var(--hand);rotate:-1.5deg;max-width:19rem;box-shadow:0 8px 18px rgba(0,0,0,.15);margin-top:10px}
.mq:empty,.tags:empty{display:none}
.loc{margin-top:16px;border:0;background:none;color:var(--ocean);border-bottom:2px solid var(--coral);font-weight:500;padding:2px 0}
.loc[hidden]{display:none}
.x{position:absolute;top:8px;right:8px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:1.6rem;line-height:1}
@media(min-width:800px){.sheet{place-items:center}.panel{border-radius:10px;grid-template-columns:1.1fr 1fr;width:min(980px,92vw)}.s-photo{aspect-ratio:auto;min-height:460px}.s-body{align-self:center;padding:40px 36px 40px 30px}}

/* stickers */
.stk{position:absolute;z-index:30;font-size:max(2.4rem,10cqw);line-height:1;cursor:grab;touch-action:none;user-select:none;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 5px 5px rgba(0,0,0,.25));animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.stk.deco{z-index:12}
.stk:hover{scale:1.15}
@keyframes pop{from{scale:0;opacity:0}}
.tray{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tray-btn{font:500 1.25rem var(--hand);background:var(--coral);color:#fff;border:0;border-radius:99px;padding:10px 22px;box-shadow:0 8px 22px rgba(18,59,71,.3);rotate:-3deg}
.tray-box{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;padding:10px;border-radius:16px;box-shadow:0 14px 40px rgba(18,59,71,.3)}
.tray-box[hidden]{display:none}
.tray-box button{font-size:1.9rem;background:none;border:0;width:46px;height:46px;border-radius:10px}
.tray-box button:hover{background:var(--sand)}
.tray-box .clr{grid-column:1/-1;font:500 1.1rem var(--hand);width:auto}
.tip{grid-column:1/-1;font:500 1.05rem/1.2 var(--hand);text-align:center;color:var(--ocean)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <section class="spread" id="top"></section>
  <section class="mapsec" id="map">
    <h2 class="sec-title">Where I went</h2>
    <p class="hint">tap a pin to open the memory</p>
    <div class="mapstage" id="mapbox"></div>
  </section>
  <section class="days" id="days">
    <h2 class="sec-title">Day by day</h2>
    <p class="hint">swipe &rarr; and tap a photo to read the story</p>
    <div class="railwrap"><button class="rnav p" id="rp" aria-label="Previous day">&#8249;</button><div class="rail" id="rail"></div><button class="rnav n" id="rn" aria-label="Next day">&#8250;</button></div>
  </section>
  <section class="spread" id="end"></section>
  <div class="foot"></div>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="panel">
    <button class="x" id="sClose" aria-label="Close">&times;</button>
    <div class="s-photo" id="sPhoto"><img id="sImg" alt=""><p class="s-cap" id="sCap"></p><button class="nv p" id="sPrev" aria-label="Previous photo">&#8249;</button><button class="nv n" id="sNext" aria-label="Next photo">&#8250;</button><div class="dots" id="sDots"></div></div>
    <div class="s-body"><p class="kick" id="sKick"></p><h3 id="sTitle"></h3><p id="sText"></p><div class="tags" id="sTags"></div><p class="mq" id="sQuote"></p><button class="loc" id="sMap">See it on the map</button></div>
  </div>
</div>

<script>
const IMG=(()=>{
const SK=[['#f9d9a8','#f4a77a','#2aa3a8','#e8d9bd'],['#bfe6ee','#fff6e2','#1c9aa6','#f1e3c6'],['#ffb88a','#f26d5b','#1f6f86','#e6cfa6'],['#cfe3ea','#e9f1ee','#5aa7ad','#e8dcc3'],['#ffd89b','#f6a86b','#177e89','#ecd9b0'],['#9bd3f0','#e8f6fb','#1c9aa6','#f3e4c3']];
const HC=['#F2B84B','#E8704F','#4FA3C7','#F2A0B5','#8CC084','#F6E27F'];
const defs=(a,b)=>`<defs><linearGradient id='a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient><radialGradient id='g'><stop offset='0' stop-color='#ffd27a'/><stop offset='1' stop-color='#ff7a2f' stop-opacity='0'/></radialGradient></defs>`;
const palm=(x,y,k)=>`<g transform='translate(${x} ${y}) scale(${k})'><path d='M0 0Q10-140 30-260' stroke='#0f2f3a' stroke-width='14' fill='none'/><path d='M30-260Q-40-290-110-240M30-260Q-10-340-90-340M30-260Q60-340 140-320M30-260Q110-270 160-200M30-260Q20-320 40-370' stroke='#0f2f3a' stroke-width='10' fill='none' stroke-linecap='round'/></g>`;
function body(t,h,p){const sx=120+(h>>3)%360,sy=130+(h>>5)%110;
if(t==='palm')return defs()+`<defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#27506a'/><stop offset='.55' stop-color='#f28c70'/><stop offset='1' stop-color='#ffc46b'/></linearGradient></defs><rect width='600' height='750' fill='url(#s)'/><circle cx='350' cy='430' r='170' fill='url(#g)'/><circle cx='350' cy='430' r='62' fill='#ffe3a0'/><rect y='470' width='600' height='140' fill='#123b47' opacity='.8'/><path d='M0 600Q300 560 600 610V750H0Z' fill='#0b2630'/>${palm(110,690,1.35)}${palm(500,700,.8)}`;
if(t==='street'){let l='',r='';for(let i=0;i<5;i++){const c=HC[(h+i)%6],c2=HC[(h+i+2)%6],w=70+i*14,x0=i*34,top=120+i*40-i*i*2;l+=`<rect x='${x0}' y='${top}' width='${w}' height='${640-top}' fill='${c}'/><rect x='${x0+14}' y='${top+40}' width='22' height='34' fill='#fff' opacity='.85'/><rect x='${x0+14}' y='${top+110}' width='22' height='34' fill='#fff' opacity='.85'/><rect x='${x0}' y='${top-10}' width='${w}' height='12' fill='#fff' opacity='.8'/>`;r+=`<rect x='${600-x0-w}' y='${top+20}' width='${w}' height='${620-top}' fill='${c2}'/><rect x='${600-x0-w+w-38}' y='${top+60}' width='22' height='34' fill='#fff' opacity='.85'/><rect x='${600-x0-w+w-38}' y='${top+130}' width='22' height='34' fill='#fff' opacity='.85'/><rect x='${600-x0-w}' y='${top+10}' width='${w}' height='12' fill='#fff' opacity='.8'/>`}
return defs('#bfe6ee','#fff6e2')+`<rect width='600' height='750' fill='url(#a)'/>${l}${r}<path d='M170 330L430 330L600 750L0 750Z' fill='#d9c9a8'/><path d='M300 340L310 750' stroke='#fff' stroke-width='6' stroke-dasharray='20 24' opacity='.7'/>`}
if(t==='church')return defs('#8fd0f2','#eaf7fc')+`<rect width='600' height='750' fill='url(#a)'/><path d='M0 520Q200 440 380 500T600 470V750H0Z' fill='#7fb26a'/><rect x='170' y='300' width='260' height='260' fill='#fff'/><rect x='250' y='190' width='100' height='120' fill='#fff'/><path d='M240 190L300 120L360 190Z' fill='#e8704f'/><path d='M300 70v50M280 90h40' stroke='#e8704f' stroke-width='8'/><path d='M270 560V440Q300 400 330 440V560Z' fill='#2a6f86'/><rect x='195' y='340' width='40' height='70' rx='20' fill='#2a6f86'/><rect x='365' y='340' width='40' height='70' rx='20' fill='#2a6f86'/><path d='M150 560H450L480 600H120Z' fill='#e6e0d0'/>${Array.from({length:14},(_,i)=>`<circle cx='${30+i*42}' cy='${640+(i%3)*30}' r='9' fill='#fff'/><circle cx='${30+i*42}' cy='${640+(i%3)*30}' r='3.5' fill='#f6c445'/>`).join('')}`;
if(t==='bonfire')return `<defs><linearGradient id='n' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#14283a'/><stop offset='1' stop-color='#5a3a4a'/></linearGradient><radialGradient id='f'><stop offset='0' stop-color='#ffd27a'/><stop offset='.5' stop-color='#ff8a3a' stop-opacity='.7'/><stop offset='1' stop-color='#ff7a2f' stop-opacity='0'/></radialGradient></defs><rect width='600' height='750' fill='url(#n)'/><circle cx='480' cy='140' r='34' fill='#fff6d8' opacity='.9'/><rect y='430' width='600' height='120' fill='#1c4a5a'/><path d='M0 520Q300 490 600 520V750H0Z' fill='#2a1d1a'/><circle cx='300' cy='590' r='230' fill='url(#f)'/><path d='M300 640Q270 590 290 540Q300 570 320 550Q335 590 300 640Z' fill='#ffb347'/><path d='M300 640Q285 605 298 575Q310 600 318 598Q320 620 300 640Z' fill='#fff1b0'/>${[110,190,420,500].map((x,i)=>`<g fill='#0b0f18'><circle cx='${x}' cy='${560+(i%2)*20}' r='20'/><path d='M${x-28} ${650+(i%2)*20}Q${x-30} ${590+(i%2)*20} ${x} ${584+(i%2)*20}Q${x+30} ${590+(i%2)*20} ${x+28} ${650+(i%2)*20}Z'/></g>`).join('')}`;
if(t==='cove')return defs(p[0],p[1])+`<rect width='600' height='750' fill='url(#a)'/><circle cx='${sx+200}' cy='${sy}' r='70' fill='#fff' opacity='.85'/><rect y='360' width='600' height='260' fill='#27b3b6'/><path d='M0 420Q150 400 300 420T600 420M0 480Q150 460 300 480T600 480' stroke='#fff' stroke-opacity='.45' stroke-width='4' fill='none'/><path d='M0 330Q80 300 150 360L170 640H0Z' fill='#b3573a'/><path d='M40 360Q110 330 160 400L180 640H60Z' fill='#8e3f2b'/><path d='M600 380Q520 330 460 430L440 640H600Z' fill='#b3573a'/><path d='M0 620Q300 560 600 620V750H0Z' fill='${p[3]}'/>`;

}
function showPhoto(i){const n=SH.photos.length;si=(i+n)%n;const p=SH.photos[si];$('#sImg').src=p.src;$('#sImg').alt=p.cap;$('#sCap').textContent=p.cap;$('#sDots').innerHTML=n>1?SH.photos.map((_,j)=>`<i class='${j===si?'on':''}'></i>`).join(''):'';$('#sPrev').hidden=$('#sNext').hidden=n<2}
function openSheet(k){SH=spec(k);$('#sKick').textContent=SH.kick;$('#sTitle').textContent=SH.title;$('#sText').textContent=SH.text;$('#sTags').innerHTML=SH.tags.map(t=>`<span>${esc(t)}</span>`).join('');$('#sQuote').textContent=SH.quote;$('#sMap').hidden=!SH.map;showPhoto(SH.i);sheet.hidden=false;document.body.style.overflow='hidden';$('#sClose').focus()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-sheet]');if(t)openSheet(t.dataset.sheet)});
document.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.sp');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openSheet(t.dataset.sheet)}
  if(sheet.hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='ArrowRight')showPhoto(si+1);if(e.key==='ArrowLeft')showPhoto(si-1)});
$('#sClose').onclick=closeSheet;$('#sPrev').onclick=()=>showPhoto(si-1);$('#sNext').onclick=()=>showPhoto(si+1);

/* ---------- scrapbook interactions ---------- */
let zTop=40;
function drag(el,o){const hold=o&&o.hold;let sx,sy,ox,oy,on=false,moved=false,timer,armed=true;const get=()=>{const t=(el.style.translate||'0px 0px').split(' ');return[parseFloat(t[0])||0,parseFloat(t[1])||0]};el.addEventListener('pointerdown',e=>{if(e.button>0)return;[ox,oy]=get();sx=e.clientX;sy=e.clientY;on=true;moved=false;armed=!(hold&&e.pointerType==='touch');if(!armed){clearTimeout(timer);timer=setTimeout(()=>{armed=true;el.classList.add('lift');navigator.vibrate&&navigator.vibrate(8)},220)}});el.addEventListener('touchmove',e=>{if(armed&&on)e.preventDefault()},{passive:false});addEventListener('pointermove',e=>{if(!on||!armed)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<5)return;if(!moved){moved=true;el.classList.add('lift');el.style.zIndex=++zTop}el.style.translate=`${ox+dx}px ${oy+dy}px`});const end=()=>{clearTimeout(timer);if(on&&moved){el._moved=true;setTimeout(()=>{el._moved=false},60)}on=false;el.classList.remove('lift')};addEventListener('pointerup',end);addEventListener('pointercancel',end);el.addEventListener('click',e=>{if(el._moved){e.stopPropagation();e.preventDefault();el._moved=false}},true)}
function sticker(ch,parent,x,y,deco){const s=document.createElement('span');s.className='stk'+(deco?' deco':'');s.textContent=ch;s.setAttribute('role','img');s.setAttribute('aria-label','sticker');s.style.cssText=`left:${x};top:${y};rotate:${Math.round(Math.random()*30-15)}deg`;parent.append(s);drag(s);if(!deco)s.style.zIndex=++zTop;s.addEventListener('dblclick',()=>s.remove())}
function interactive(){
  document.querySelectorAll('.sc').forEach(f=>drag(f,{hold:true}));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.25});
  document.querySelectorAll('.stage').forEach(s=>io.observe(s));
  const step=()=>$('.rail .stage').offsetWidth+22;
  $('#rp').onclick=()=>$('#rail').scrollBy({left:-step(),behavior:'smooth'});
  $('#rn').onclick=()=>$('#rail').scrollBy({left:step(),behavior:'smooth'});
  const tray=document.createElement('div');tray.className='tray';
  tray.innerHTML=`<div class='tray-box' hidden>${['🐚','🌴','☀️','🦀','🍹','⭐','🐠','🥥'].map(e=>`<button data-e='${e}' aria-label='Add sticker ${e}'>${e}</button>`).join('')}<p class='tip'>Drag to place. Double-tap to remove.</p><button class='clr'>Clear mine</button></div><button class='tray-btn' aria-expanded='false'>Stickers</button>`;
  document.body.append(tray);const box=tray.firstChild,btn=tray.lastChild;
  btn.onclick=()=>{box.hidden=!box.hidden;btn.setAttribute('aria-expanded',!box.hidden)};
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('clr')){document.querySelectorAll('.stk:not(.deco)').forEach(s=>s.remove());return}sticker(b.dataset.e,document.body,(innerWidth*.2+Math.random()*innerWidth*.5)+'px',(scrollY+innerHeight*.3+Math.random()*innerHeight*.3)+'px')};
}

/* ---------- share ---------- */
const toast=m=>{const t=$('#toast');t.textContent=m;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent='',3000)};
async function copyLink(){try{await navigator.clipboard.writeText(location.href)}catch{const i=document.createElement('input');i.value=location.href;document.body.append(i);i.select();document.execCommand('copy');i.remove()}toast('Link copied')}
function wireShare(){$('#copyBtn').onclick=copyLink;$('#shareBtn').onclick=async()=>{if(navigator.share){try{await navigator.share({title:D.title,text:D.short,url:location.href})}catch{}}else copyLink()}}

build();initMap();interactive();wireShare();
</script>
